id = "conner.vaultr"
name = "vaultr sessions"
version = "0.1.0"
min_herdr_version = "0.7.0"
platforms = ["macos", "linux"]

[[actions]]
id = "copy-path"
title = "Copy vault session path"
contexts = ["pane"]
command = ["./plugin/copy-path.sh"]

[[actions]]
id = "show"
title = "Show vault session transcript"
contexts = ["pane"]
command = ["./plugin/show.sh"]

[[actions]]
id = "fork"
title = "Fork vault session"
contexts = ["pane"]
command = ["./plugin/fork.sh"]
