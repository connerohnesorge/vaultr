[package]
name = "plant"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "time", "io-util", "fs", "sync"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json", "gzip", "brotli", "deflate", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
regex = "1"
zstd = "0.13"
futures-util = "0.3"
bytes = "1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
libc = "0.2"
vaultr = { path = "../vaultr" }
rcgen = { version = "0.14.8", default-features = false, features = ["pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
