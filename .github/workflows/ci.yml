name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: plugin/fork_test.sh
      - run: cargo run --release -p plant -- --self-test

  door-tests:
    name: Door tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun test ts/vaultr-door

  # The flake is the delivery vehicle: Home Manager fetches this repo and runs
  # the result, so a green cargo build with a broken flake still breaks the host.
  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check --print-build-logs
      - run: nix build .#default --print-build-logs

  # The broker image is built here rather than in athens: athens builds only
  # from its gitlab-group webhook, and this source lives on GitHub.
  #
  # It publishes to GHCR and stops there. athens pulls it through the ECR
  # pull-through cache that already fronts ghcr.io, so no AWS credential,
  # role, or OIDC trust exists anywhere in this pipeline. The registry the
  # cluster reads from is a mirror it already controls, not a door this
  # workflow was handed a key to.
  broker-image:
    name: Broker image
    needs: checks
    # main only: a fork's pull_request must never publish a broker image.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/plant-broker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Report the image
        run: |
          {
            echo "### Broker image"
            echo '```'
            echo "$IMAGE:$GITHUB_SHA"
            echo '```'
            echo "Pulled in athens through the ghcr pull-through cache as:"
            echo '```'
            echo "485494358268.dkr.ecr.us-east-2.amazonaws.com/ghcr/${{ github.repository }}/plant-broker:$GITHUB_SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
